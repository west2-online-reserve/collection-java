name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Check data snapshot is present
        run: |
          test -f src/data/data.json   || { echo "缺少 src/data/data.json";   exit 1; }
          test -f src/data/manifest.json || { echo "缺少 src/data/manifest.json"; exit 1; }

      - name: Build, test and package
        run: mvn -B verify

      - name: Smoke test (java -jar)
        run: |
          printf 'players\nresult men 10m platform\nbadcmd\n' > /tmp/in.txt
          java -jar target/DWASearch.jar /tmp/in.txt /tmp/out.txt
          grep -q '^Full Name:COLE Ellie$' /tmp/out.txt
          grep -q '^Full Name:BAI Yuming$'  /tmp/out.txt
          grep -q '^Error$'                 /tmp/out.txt
          if grep -q $'\r' /tmp/out.txt; then
            echo "输出含 CR，按要求应只有 \\n"
            exit 1
          fi
          echo "冒烟测试通过：$(grep -c '^Full Name:' /tmp/out.txt) 条选手/成绩记录"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: DWASearch-jar
          path: target/DWASearch.jar
          if-no-files-found: error
